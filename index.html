<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PMR Editor">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>PMR Editor</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-header: #1e293b;
      --bg-input: #334155;
      --accent: #10b981;
      --accent-hover: #059669;
      --share-accent: #0ea5e9;
      --share-hover: #0284c7;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --excel-border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    html, body {
      touch-action: manipulation;
      overscroll-behavior-y: contain;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding-top: max(14px, env(safe-area-inset-top));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      padding-left: max(14px, env(safe-area-inset-left));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      max-width: 100%;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.45rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .subtitle-text {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 3px;
    }

    .version-badge {
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }

    .offline-pill {
      font-size: 0.68rem;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 2px 8px;
      border-radius: 999px;
      display: none;
    }

    .header-status {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .filled-badge {
      font-size: 0.79rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
      white-space: nowrap;
    }

    .filled-badge.complete {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }

    .draft-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: none;
      white-space: nowrap;
      transition: background-color 0.25s ease;
    }

    .draft-badge.visible {
      display: inline-flex;
      align-items: center;
    }

    .draft-badge.pulse {
      background: rgba(16, 185, 129, 0.26);
    }

    .imported-file-info {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--border-color);
      padding: 3px 8px 3px 10px;
      border-radius: 999px;
      max-width: 100%;
    }

    .imported-file-info.visible {
      display: inline-flex;
    }

    .imported-file-name {
      color: #e2e8f0;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 240px;
    }

    .unload-file-btn {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.38);
      color: #fca5a5;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .unload-file-btn:hover {
      background: rgba(239, 68, 68, 0.32);
      border-color: var(--danger);
      color: #ffffff;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
      background: var(--bg-card);
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      align-items: flex-end;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 165px;
    }

    .control-group.search-group {
      flex: 2;
    }

    .field-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      line-height: 1.25;
      display: block;
    }

    select, input[type="text"], .checkbox-box {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0 12px;
      height: 40px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
      width: 100%;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    .checkbox-box {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .checkbox-box:hover {
      border-color: var(--accent);
    }

    .checkbox-box input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrap input {
      padding-right: 32px;
    }

    .clear-search-btn {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
      padding: 2px 5px;
      display: none;
    }

    .clear-search-btn:hover {
      color: var(--text-main);
    }

    .btn {
      height: 40px;
      padding: 0 13px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-share {
      background-color: rgba(14, 165, 233, 0.16);
      border: 1px solid rgba(14, 165, 233, 0.45);
      color: #38bdf8;
    }

    .btn-share:hover {
      background-color: rgba(14, 165, 233, 0.26);
      border-color: var(--share-accent);
    }

    .btn-secondary {
      background-color: #475569;
      color: #ffffff;
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    .btn-ghost {
      background-color: rgba(51, 65, 85, 0.65);
      border: 1px solid var(--border-color);
      color: #e2e8f0;
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-danger-ghost {
      background-color: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .btn-danger-ghost:hover {
      background-color: rgba(239, 68, 68, 0.22);
      border-color: var(--danger);
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-flex;
    }

    .file-input-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .export-wrapper {
      display: inline-flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      height: 40px;
    }

    .export-wrapper select {
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 0 10px;
      height: 100%;
      font-size: 0.86rem;
      font-weight: 600;
      width: auto;
      cursor: pointer;
    }

    .export-wrapper select option {
      background-color: var(--bg-card);
      color: var(--text-main);
    }

    .export-wrapper .btn-primary {
      border-radius: 0 7px 7px 0;
      height: 100%;
    }

    /* Sticky Quick Utility Toolbar */
    .quick-toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background-color: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    }

    .quick-toolbar .btn {
      height: 36px;
      font-size: 0.83rem;
      padding: 0 11px;
    }

    .toolbar-status-row {
      display: none;
      width: 100%;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-left: auto;
    }

    .filter-info {
      font-size: 0.8rem;
      color: #fbbf24;
      font-weight: 500;
      display: none;
    }

    /* Load Error Banner (if opened via file:// without server) */
    .load-error-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 0.86rem;
      line-height: 1.5;
      display: none;
    }

    /* HORIZONTAL EXCEL-LIKE GRID (DESKTOP AUTO) */
    .excel-container {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 18px;
    }

    .excel-table {
      border-collapse: collapse;
      width: max-content;
      font-size: 0.85rem;
    }

    .excel-table th, .excel-table td {
      border: 1px solid var(--excel-border);
      padding: 8px 10px;
      text-align: center;
      white-space: nowrap;
      min-width: 138px;
      max-width: 220px;
    }

    .excel-table th.eq-header {
      background-color: #0f172a;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.86rem;
      border-bottom: 2px solid var(--accent);
      padding: 10px 12px;
    }

    .excel-table th.tag-header {
      background-color: #1e293b;
      color: #e2e8f0;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .excel-table th.unit-header {
      background-color: #334155;
      color: #6ee7b7;
      font-weight: 500;
      font-size: 0.75rem;
    }

    .excel-table tr.input-row td {
      background-color: #0f172a;
      padding: 6px 8px;
    }

    /* VERTICAL TABLE LAYOUT (MOBILE AUTO) */
    .vertical-container {
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 18px;
      overflow: hidden;
    }

    .vertical-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
    }

    .vertical-table thead th {
      background-color: #0f172a;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 10px 12px;
      border-bottom: 2px solid var(--accent);
      text-align: left;
    }

    .vertical-table thead th.col-val {
      width: 122px;
      text-align: center;
    }

    .vertical-table tbody tr {
      border-bottom: 1px solid var(--border-color);
      background-color: #162033;
      transition: background-color 0.12s;
    }

    .vertical-table tbody tr:nth-child(even) {
      background-color: #1b263b;
    }

    .vertical-table tbody tr.row-highlight {
      background-color: rgba(245, 158, 11, 0.14);
    }

    .vertical-table td {
      padding: 9px 10px;
      vertical-align: middle;
    }

    .vertical-table td.cell-tap-target {
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: rgba(16, 185, 129, 0.14);
      padding-left: 12px;
    }

    .vertical-table td.cell-tap-target:active {
      background-color: rgba(16, 185, 129, 0.12);
    }

    .param-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .param-eq {
      font-weight: 700;
      color: #f1f5f9;
      font-size: 0.85rem;
      line-height: 1.25;
      word-break: break-word;
    }

    .param-sub {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
    }

    .param-num-badge {
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.74rem;
    }

    .param-tag {
      color: #cbd5e1;
      font-weight: 600;
    }

    .param-unit-pill {
      background-color: rgba(16, 185, 129, 0.14);
      color: #6ee7b7;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    /* SHARED CELL INPUT & SELECT STYLING */
    .excel-input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #ffffff;
      padding: 0 8px;
      height: 36px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    select.excel-input {
      padding: 0 4px;
      cursor: pointer;
    }

    .excel-input.cell-empty {
      border: 1px dashed #64748b;
      background-color: rgba(51, 65, 85, 0.55);
    }

    .excel-input.cell-warning {
      border-style: solid;
      border-color: var(--warning);
      background-color: rgba(245, 158, 11, 0.14);
      color: #fbbf24;
    }

    .excel-input:focus {
      border-style: solid;
      border-color: var(--accent);
      background-color: #1e293b;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
      color: #10b981;
    }

    .excel-input.highlight {
      border-style: solid;
      border-color: #f59e0b;
      background-color: rgba(245, 158, 11, 0.18);
    }

    .col-index {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }

    /* CUSTOM MODAL SYSTEM */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.15s ease-out;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid #475569;
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      animation: popUp 0.18s ease-out;
    }

    .modal-card.update-card {
      border-color: rgba(16, 185, 129, 0.65);
      box-shadow: 0 20px 50px rgba(16, 185, 129, 0.18), 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .modal-icon.info {
      background: rgba(14, 165, 233, 0.16);
      border: 1px solid rgba(14, 165, 233, 0.4);
    }

    .modal-icon.success {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .modal-icon.warning {
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .modal-icon.danger {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .modal-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .modal-body {
      padding: 14px 18px 16px;
      font-size: 0.87rem;
      color: #cbd5e1;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .modal-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .modal-bullets li {
      font-size: 0.83rem;
      color: #e2e8f0;
      line-height: 1.42;
      padding-left: 16px;
      position: relative;
    }

    .modal-bullets li::before {
      content: "•";
      position: absolute;
      left: 3px;
      color: var(--warning);
      font-weight: 700;
    }

    .modal-bullets.success-list li::before {
      color: var(--accent);
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 18px 16px;
      background: rgba(15, 23, 42, 0.45);
      border-top: 1px solid var(--border-color);
    }

    .modal-actions.row-layout {
      flex-direction: row;
      justify-content: flex-end;
    }

    .modal-actions .btn {
      width: 100%;
    }

    .modal-actions.row-layout .btn {
      width: auto;
      min-width: 104px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popUp {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Scrollbar styling */
    .excel-container::-webkit-scrollbar {
      height: 12px;
    }
    .excel-container::-webkit-scrollbar-track {
      background: #0f172a;
      border-radius: 0 0 12px 12px;
    }
    .excel-container::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 6px;
      border: 3px solid #0f172a;
    }
    .excel-container::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }

    /* Footer Credit */
    footer.app-footer {
      margin-top: auto;
      padding-top: 14px;
      padding-bottom: 2px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* Mobile Responsive Refinements */
    @media (max-width: 767px) {
      body {
        padding-top: max(10px, env(safe-area-inset-top));
        padding-right: max(10px, env(safe-area-inset-right));
        padding-bottom: max(14px, env(safe-area-inset-bottom));
        padding-left: max(10px, env(safe-area-inset-left));
      }

      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 12px;
        padding-bottom: 10px;
      }

      h1 {
        font-size: 1.28rem;
      }

      .header-status {
        width: 100%;
        align-items: flex-start;
        text-align: left;
      }

      .header-status:empty,
      .header-status:not(:has(.visible)) {
        display: none;
      }

      .status-row {
        justify-content: flex-start;
      }

      .imported-file-name {
        max-width: 210px;
      }

      .controls-bar {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        align-items: end;
        padding: 12px;
        gap: 10px;
      }

      .control-group {
        min-width: 0;
      }

      select, input[type="text"] {
        font-size: 16px;
        padding: 0 9px;
      }

      .operator-group {
        grid-column: span 6;
        order: 1;
      }

      .speed-group {
        grid-column: span 6;
        order: 2;
      }

      .checkbox-box {
        font-size: 0.85rem;
        padding: 0 10px;
        gap: 8px;
      }

      .import-group {
        grid-column: span 4;
        order: 3;
        width: 100%;
      }

      .import-group .btn {
        width: 100%;
        padding: 0 8px;
      }

      .search-group {
        grid-column: span 8;
        order: 4;
      }

      .export-group {
        grid-column: span 12;
        order: 5;
        display: grid;
        grid-template-columns: 66% 34%;
        width: 100%;
      }

      .export-group select {
        width: 100%;
        min-width: 0;
        font-size: 16px;
        padding: 0 8px;
      }

      .export-group .btn-primary {
        width: 100%;
        padding: 0 10px;
      }

      .quick-toolbar {
        padding: 8px 10px;
        border-radius: 0 0 10px 10px;
        margin-left: calc(-1 * max(10px, env(safe-area-inset-left)));
        margin-right: calc(-1 * max(10px, env(safe-area-inset-right)));
        border-left: none;
        border-right: none;
        gap: 7px;
      }

      .toolbar-status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        gap: 8px;
      }

      .toolbar-status-row .filled-badge,
      .toolbar-status-row .draft-badge {
        font-size: 0.73rem;
        padding: 3px 9px;
      }

      .toolbar-left {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
        gap: 6px;
      }

      .toolbar-left .btn {
        width: 100%;
        padding: 0 6px;
        font-size: 0.81rem;
      }

      .toolbar-right {
        width: 100%;
        justify-content: center;
        margin-left: 0;
      }

      .toolbar-right:not(:has(.filter-info[style*="display: inline"])) {
        display: none;
      }

      .vertical-table thead th.col-val {
        width: 118px;
      }

      .vertical-table td {
        padding: 8px 8px;
      }

      .vertical-table td.cell-tap-target {
        padding-left: 10px;
      }

      .excel-input {
        font-size: 16px;
        height: 38px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div>
        <h1>
          📝 PMR Editor
          <span class="version-badge">v1.6.0</span>
          <span id="offlineBadge" class="offline-pill">📡 Offline Mode</span>
        </h1>
        <p class="subtitle-text">Editor Macro Logsheet DILOC Pabrik Urea 1B</p>
      </div>
      <div class="header-status" id="headerStatusContainer">
        <div class="status-row" id="headerDraftSlot">
          <span id="draftSavedBadge" class="draft-badge" aria-live="polite">✓ Draft tersimpan</span>
        </div>
        <div id="importedFileInfo" class="imported-file-info">
          <span id="importedFileIcon">📄</span>
          <span id="importedFilePrefix">File aktif:</span>
          <span id="importedFileName" class="imported-file-name"></span>
          <button type="button" id="unloadFileBtn" class="unload-file-btn" title="Lepas file aktif &amp; kosongkan tabel" onclick="unloadActiveFileConfirm()">✕</button>
        </div>
      </div>
    </header>

    <div class="controls-bar">
      <div class="control-group operator-group">
        <label class="field-label" for="selectOperator">Pilih Operator</label>
        <select id="selectOperator" onchange="loadParameter(this.value)">
          <option value="operator1" selected>Operator 1 (167)</option>
          <option value="operator2">Operator 2 (51)</option>
          <option value="operator3">Operator 3 (45)</option>
        </select>
      </div>

      <div class="control-group speed-group">
        <label class="field-label" for="superFastMode">Kecepatan Pengisian</label>
        <label class="checkbox-box" for="superFastMode" title="Centang untuk pengisian super cepat, atau hilangkan centang untuk mengikuti kecepatan bawaan file">
          <input type="checkbox" id="superFastMode" checked onchange="saveDraftToStorage()">
          <span>⚡ Mode Satset</span>
        </label>
      </div>

      <div class="control-group search-group">
        <label class="field-label" for="searchInput">Cari Tag / Equipment</label>
        <div class="search-input-wrap">
          <input type="text" id="searchInput" enterkeyhint="search" placeholder="Ketik tag atau equipment (cth: LG-801, GA504...)" oninput="filterParameters()">
          <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Hapus pencarian" onclick="clearSearch()">✕</button>
        </div>
      </div>

      <div class="file-input-wrapper import-group">
        <button type="button" class="btn btn-secondary">📂 Import</button>
        <input type="file" id="importFileInput" onchange="importData(event)">
      </div>

      <div class="export-wrapper export-group">
        <select id="exportFormat" title="Pilih format file export">
          <option value="pmr" selected>⚡ Macro PMR (.pmr)</option>
          <option value="webrunner">🌐 Web Runner (.json)</option>
        </select>
        <button type="button" class="btn btn-primary" onclick="handleExport()">💾 Export</button>
      </div>
    </div>

    <div class="quick-toolbar">
      <div class="toolbar-status-row" id="mobileToolbarStatusSlot"></div>
      <div class="toolbar-left">
        <button type="button" class="btn btn-share" title="Kirim langsung via LocalSend / Share HP" onclick="handleShare()">📤 Share</button>
        <button type="button" class="btn btn-ghost" onclick="jumpToNextEmpty()">🔍 Sel Kosong</button>
        <button type="button" class="btn btn-danger-ghost" onclick="resetFormConfirm()">🗑️ Reset</button>
      </div>
      <div class="toolbar-right" id="desktopToolbarRightSlot">
        <span id="filterMatchInfo" class="filter-info"></span>
        <span id="filledCountBadge" class="filled-badge">Terisi: 0 / 0 Cell</span>
      </div>
    </div>

    <div id="loadErrorBox" class="load-error-box"></div>

    <form id="pmrForm" onsubmit="event.preventDefault();">
      <!-- Horizontal Scrollable Excel Grid (Desktop Auto) -->
      <div class="excel-container" id="excelScrollContainer">
        <table class="excel-table" id="excelTable">
          <thead>
            <tr id="headerEquipmentRow"></tr>
            <tr id="headerTagRow"></tr>
            <tr id="headerUnitRow"></tr>
          </thead>
          <tbody>
            <tr class="input-row" id="inputCellsRow"></tr>
          </tbody>
        </table>
      </div>

      <!-- Vertical Table Layout (Mobile Auto) -->
      <div class="vertical-container" id="verticalScrollContainer" style="display: none;">
        <table class="vertical-table" id="verticalTable">
          <thead>
            <tr>
              <th>Equipment &amp; Tag (Tap baris untuk isi)</th>
              <th class="col-val">Nilai</th>
            </tr>
          </thead>
          <tbody id="verticalBodyRows"></tbody>
        </table>
      </div>
    </form>

    <footer class="app-footer">
      © 2026 — Developed by FIKRI
    </footer>
  </div>

  <!-- Custom Modal Dialog -->
  <div id="appModalOverlay" class="modal-overlay" aria-hidden="true">
    <div id="appModalCard" class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div id="modalIcon" class="modal-icon info">ℹ️</div>
        <h3 id="modalTitle" class="modal-title">Informasi</h3>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <script src="app.js?v=1.6.0"></script>
</body>
</html>
